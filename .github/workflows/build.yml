name: build

# Builds every plugin in the solution. Push a tag like v1.2.0 to publish a GitHub release.
#
# The projects compile against Unity / Il2Cpp interop DLLs that BepInEx generates from the game. They are NOT stored in
# this public repo: they are fetched from a PRIVATE repo with a read-only deploy key kept in the repo secret
# INTEROP_DEPLOY_KEY. Setup steps: CONTRIBUTING.md ("CI and the private interop repo").
#
# Security notes:
#  * Pull requests from forks get no secrets (GitHub rule), so they cannot read the interop repo - they are skipped.
#  * Never switch this to the pull_request_target event, and never check out untrusted PR code next to the secret.
#  * Anyone with write access to THIS repo can read the secret through a workflow: keep write access to trusted people.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  INTEROP_REPO: DiceModders/Tyoms-DiceKingdoms-Interop

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create releases
    steps:
      - uses: actions/checkout@v4

      - name: Check that the interop secret exists
        shell: pwsh
        env:
          KEY: ${{ secrets.INTEROP_DEPLOY_KEY }}
        run: |
          if (-not $env:KEY) { throw "The secret INTEROP_DEPLOY_KEY is not set. See CONTRIBUTING.md." }

      - name: Fetch interop assemblies (private repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INTEROP_REPO }}
          ssh-key: ${{ secrets.INTEROP_DEPLOY_KEY }}
          path: interop
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-ci' }
          dotnet build DiceKingdoms.Mods.sln -c Release "-p:Version=$version" "-p:NoWarn=NU1603"
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Package
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY.Split('/')[1]      # the zip is named after the repo, whatever it is called
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "ci-" + $env:GITHUB_SHA.Substring(0, 7) }
          $plugins = "dist\BepInEx\plugins"
          New-Item -ItemType Directory -Force $plugins | Out-Null
          # only OUR plugin DLLs go into the package - never anything from the interop folder
          Get-ChildItem src -Recurse -Filter "DiceModders.*.dll" |
            Where-Object { $_.FullName -match "\\bin\\Release\\" } |
            ForEach-Object { Copy-Item $_.FullName $plugins }
          Get-ChildItem $plugins
          # players unzip this straight into the game folder
          Compress-Archive -Path "dist\BepInEx" -DestinationPath "$repo-$tag.zip" -Force
          "ZIP_NAME=$repo-$tag.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            dist/BepInEx/plugins/*.dll
            ${{ env.ZIP_NAME }}

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            dist/BepInEx/plugins/*.dll
          generate_release_notes: true
